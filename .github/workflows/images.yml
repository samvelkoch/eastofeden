name: images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data.json, tools/fetch_images.py]
permissions:
  contents: write
concurrency: images
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/fetch_images.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898300+github-actions[bot]@users.noreply.github.com"
          git add img/w data.json
          git diff --cached --quiet && exit 0
          git commit -m "Картинки: скачаны с Wikimedia Commons"
          git pull --rebase origin main && git push
